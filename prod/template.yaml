## Install with:
#  omnictl cluster template sync -f template.yaml
kind: Cluster
name: talos-prod
kubernetes:
  version: v1.36.5
talos:
  version: v1.14.5
features:
  enableWorkloadProxy: true
  diskEncryption: false
  useEmbeddedDiscoveryService: true
patches:
  - name: spegel
    file: patches/spegel.yaml
  - name: enable-workload
    file: patches/workload-on-cp.yml
  - name: kubespan-enabled
    file: patches/kubespan.yml
  - name: no-cni # we will install cilium in extraManifests
    file: patches/cni.yml
  - name: disable-kubeproxy
    file: patches/disable-kubeproxy.yml
  - name: manifests
    file: patches/extraManifests.yml
  - name: metric-server
    file: patches/metrics-server.yml
  - name: local-storage
    file: patches/local-storage.yml
# Pinned so the installed image doesn't inherit the boot ISO's extensions
# (the SaaS ISO came with vmtoolsd, which crash-loops on Proxmox).
# Same set as the self-hosted install (schematic e4dda754…).
systemExtensions:
  - siderolabs/i915
  - siderolabs/intel-ice-firmware
  - siderolabs/intel-ucode
  - siderolabs/iscsi-tools
  - siderolabs/nvme-cli
  - siderolabs/qemu-guest-agent
  - siderolabs/usb-modem-drivers
  - siderolabs/util-linux-tools
---
kind: ControlPlane
labels:
  type: control-plane
machineClass:
  name: control-plane
  size: 1
